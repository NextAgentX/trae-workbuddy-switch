[package]
name = "buddy-switch-gateway"
version = "2026.9.241700"
edition = "2021"
description = "WorkBuddy API 网关：把 WorkBuddy 模型额度暴露为 OpenAI / Anthropic 兼容端点"

[dependencies]
buddy-switch-core = { path = "../buddy-switch-core" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
anyhow = "1"
regex = "1"

[dev-dependencies]
# `tower` 已在 Cargo.lock（axum 0.7 的传递依赖），仅用于路由级测试的 `oneshot` 驱动。
tower = { version = "0.5", features = ["util"] }
